name: npm publish

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build
        continue-on-error: true

      - name: Bump patch version and publish
        run: |
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name || ''")
            private=$(node -p "require('./$pkg').private || false")
            if [ -z "$name" ] || [ "$private" = "true" ]; then
              continue
            fi
            echo "Publishing $name from $dir..."
            cd "$dir"
            npm version patch --no-git-tag-version || true
            npm publish --access public --tag latest || echo "Skipped $name"
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
